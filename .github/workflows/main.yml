name: Blender News Bot

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install feedparser requests huggingface_hub
      
      - name: Run news collector
        run: python script.py
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      
      - name: Save state
        run: python -c "import os; os.system('git config --global user.name github-actions-bot'); os.system('git config --global user.email actions@github.com'); os.system('git add posted.json'); os.system('git diff --staged --quiet || git commit -m update'); os.system('git push')"
